# Liest alle 3 Tage eine Zeile aus der Datenbank.
# Grund: Kostenlose Supabase-Projekte werden nach 7 Tagen ohne Aktivität pausiert.
# Die Tabelle "wach" enthält keine Nutzerdaten; der Publishable Key darf öffentlich sein.
name: Supabase wach halten

on:
  schedule:
    - cron: '17 5 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Datenbank einmal lesen
        run: |
          curl --fail --silent --show-error \
            "https://zmrmtnmsutfrdmfwuylp.supabase.co/rest/v1/wach?select=id" \
            -H "apikey: sb_publishable_2XBtLtL3fcGiKDip8mN0lA_XXKsNmxr"
